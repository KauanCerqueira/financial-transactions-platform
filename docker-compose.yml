services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: financial_transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_transactions"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro

  api:
    build:
      context: ./backend
      dockerfile: src/FinancialTransactions.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=financial_transactions;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Uri: "amqp://guest:guest@rabbitmq:5672"
      RabbitMq__QueueName: "transactions"
      Authentication__Authority: "http://keycloak:8080/realms/fraga"
      Authentication__Audience: "financial-transactions-api"
      Authentication__Issuers__0: "http://keycloak:8080/realms/fraga"
      Authentication__Issuers__1: "http://localhost:8081/realms/fraga"
      ASPNETCORE_ENVIRONMENT: Production
      Observability__ElasticsearchUri: "${ELASTICSEARCH_URI:-}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: src/FinancialTransactions.Worker/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=financial_transactions;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Uri: "amqp://guest:guest@rabbitmq:5672"
      RabbitMq__QueueName: "transactions"
      DOTNET_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

  # Opcional: suba com `docker compose --profile observability up`
  # e defina ELASTICSEARCH_URI=http://elasticsearch:9200 para indexar os logs.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  postgres-data:
  elasticsearch-data:
